name: Build SMS sender app

on:
  push:
    branches: [main]
    paths: ['smsgateway/**', '.github/workflows/build-smsgateway.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Decode signing key
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/alphamart.keystore"
      - name: Build release APK
        working-directory: smsgateway
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/alphamart.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Rename APK
        run: cp smsgateway/app/build/outputs/apk/release/app-release.apk alphamart-smsgateway-1.0.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: alphamart-smsgateway-apk
          path: alphamart-smsgateway-*.apk
          retention-days: 30
