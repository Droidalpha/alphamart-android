name: Build Android apps

# Runs when you push, or press "Run workflow" on the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer, delivery]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Check settings
        env:
          APP_URL: ${{ vars.APP_URL }}
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          [ -n "$APP_URL" ] || { echo "::error::Add a repository variable named APP_URL (your server address, e.g. https://shop.yourdomain.com). See README step 3."; exit 1; }
          [ -n "$KS" ] || { echo "::error::Add the signing secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). See README step 3."; exit 1; }

      - name: Install packages
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Firebase config (push notifications)
        working-directory: ${{ matrix.app }}
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then echo "$GS" | base64 -d > android/app/google-services.json; else echo "::warning::GOOGLE_SERVICES_JSON secret missing. The app will build but push notifications will not work."; fi

      - name: Sync web assets into the Android project
        working-directory: ${{ matrix.app }}
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: npm run sync

      - name: Decode signing key
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/alphamart.keystore"

      - name: Build release APK
        working-directory: ${{ matrix.app }}/android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/alphamart.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp ${{ matrix.app }}/android/app/build/outputs/apk/release/app-release.apk alphamart-${{ matrix.app }}-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: alphamart-${{ matrix.app }}-apk
          path: alphamart-${{ matrix.app }}-*.apk
          retention-days: 30
