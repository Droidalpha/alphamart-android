apply plugin: 'com.android.application'

def appVersionCode = Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
def appVersionName = System.getenv("VERSION_NAME") ?: "1.0"

android {
    namespace = "com.alphamart.smsgateway"
    compileSdk = 36
    defaultConfig {
        applicationId "com.alphamart.smsgateway"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode = appVersionCode
        versionName = appVersionName
    }
    signingConfigs {
        release {
            def ks = System.getenv("KEYSTORE_PATH")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("KEYSTORE_PATH")) { signingConfig signingConfigs.release }
        }
    }
    lint { abortOnError false; checkReleaseBuilds false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
